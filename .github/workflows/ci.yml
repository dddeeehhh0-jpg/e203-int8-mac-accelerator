name: regress

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rtl-regress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install simulator, synthesis tool and grammar checker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
          iverilog -V | head -1
          python3 -m pip install --quiet pyverilog "yowasp-yosys==0.70.0.0.post1259"
          yowasp-yosys -V | head -2

      - name: Full RTL regression (simulation mandatory)
        run: python3 run_regress.py --strict

      - name: Logic synthesis (generic cells, NO PDK / NO PPA)
        run: python3 syn/run_synth.py --strict

      - name: Gate-level replay of the synthesised netlists
        run: python3 run_gatelevel.py --strict

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: |
            results/
            vectors/gen/manifest.csv
            syn/out/*_net.v
            syn/out/*_yosys.log
            syn/out/netlist_manifest.csv
          if-no-files-found: warn

  formal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SMT solver and Yosys / SymbiYosys wrappers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3
          python3 -m pip install --quiet "yowasp-yosys==0.70.0.0.post1259"
          z3 -version
          python3 -c "import shutil; print('sby:', shutil.which('sby') or shutil.which('yowasp-sby'))"

      - name: Formal proofs and negative mutation tests
        run: python3 formal/run_formal.py --strict

      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-evidence
          path: |
            formal/out/
            results/formal_report.md
          if-no-files-found: warn
